<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#061b43" />
  <title>Jarvis Pro — by Sergio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <main class="app-window" id="appWindow">
    <header class="titlebar">
      <a class="wordmark" href="#" aria-label="Jarvis Pro, на главную">JARVIS <span>PRO</span></a>
      <div class="window-actions">
        <button class="window-btn maximize" id="maximize" aria-label="Развернуть окно"><span></span></button>
        <button class="window-btn minimize" id="minimize" aria-label="Свернуть окно"><span></span></button>
        <button class="window-btn close" id="close" aria-label="Закрыть окно"><span></span></button>
      </div>
    </header>

    <section class="visual-panel" aria-label="Анимация Jarvis">
      <div class="orb-halo"></div>
      <canvas id="orb" aria-hidden="true"></canvas>
      <div class="signature">B Y&nbsp; S E R G I O</div>
    </section>

    <div class="divider"></div>

    <section class="chat-panel" aria-label="Чат с Jarvis">
      <div class="chat-top">
        <button class="mode-button" id="modeButton"><span class="status-dot"></span><span id="modeLabel">Личный помощник</span><svg viewBox="0 0 12 12" aria-hidden="true"><path d="m3 4.5 3 3 3-3"/></svg></button>
        <div class="mode-menu" id="modeMenu" hidden>
          <button data-mode="Личный помощник">✦ &nbsp; Личный помощник</button>
          <button data-mode="Творческий режим">✧ &nbsp; Творческий режим</button>
          <button data-mode="Режим кодера">⌘ &nbsp; Режим кодера</button>
        </div>
      </div>
      <div class="conversation" id="conversation">
        <div class="welcome" id="welcome">
          <div class="welcome-icon"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M18.1 6.4c1.4-2.4 4.8-2.4 6.2 0l16 27.7c1.4 2.4-.3 5.4-3.1 5.4H5.2c-2.8 0-4.5-3-3.1-5.4l16-27.7Z" transform="translate(4 1) scale(.83)"/></svg></div>
          <h1>С чего начнём?</h1>
          <p class="welcome-hint">Я рядом, чтобы помочь с любой задачей</p>
        </div>
      </div>
      <form class="composer" id="composer">
        <textarea id="prompt" rows="1" placeholder="Чем могу помочь сегодня?" aria-label="Введите сообщение"></textarea>
        <div class="composer-toolbar">
          <div class="toolbar-left">
            <label class="icon-button attach" title="Прикрепить файл"><input id="fileInput" type="file" hidden /><svg viewBox="0 0 24 24"><path d="M12 20.5a8.5 8.5 0 1 0-8.5-8.5M12 4v8l5 3"/><path d="M3.5 12H8"/></svg></label>
            <span class="file-name" id="fileName"></span>
          </div>
          <div class="toolbar-right">
            <button class="icon-button mic" id="mic" type="button" title="Голосовой ввод"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3m-4 0h8"/></svg></button>
            <button class="send-button" id="send" type="submit" title="Отправить" aria-label="Отправить сообщение"><svg viewBox="0 0 24 24"><path d="m5 12 14-7-4 14-3.5-5L5 12Z"/><path d="m11.5 14 4.5-6"/></svg></button>
          </div>
        </div>
      </form>
      <p class="disclaimer">Jarvis может ошибаться. Проверяйте важную информацию.</p>
    </section>
    <aside class="update-toast" id="updateToast" role="status" aria-live="polite" hidden>
      <span class="update-indicator" id="updateIndicator"></span>
      <div class="update-copy"><strong id="updateTitle">Обновление</strong><span id="updateMessage"></span></div>
      <button id="installUpdate" type="button" hidden>Перезапустить</button>
      <button class="dismiss-update" id="dismissUpdate" type="button" aria-label="Скрыть">×</button>
    </aside>
    <div class="close-overlay" id="closeOverlay" hidden>
      <div class="close-card"><div class="close-orb">✦</div><h2>До скорой встречи</h2><p>Jarvis всегда будет рядом.</p><button id="reopen">Вернуться</button></div>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
